<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Portfolio Deck</title>

  <!-- Swiper.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #ffffff;
    }

    /* Header thanh trên cùng đè lên slide */
    .header-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 100%);
      pointer-events: none;
    }
    .header-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffffff;
      pointer-events: auto;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .slide-counter {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: auto;
    }

    /* Cấu hình Swiper tràn toàn màn hình */
    .swiper {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }
    .swiper-slide {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-color: #000000;
    }

    /* Ảnh slide tràn full màn hình mà không bị méo */
    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Nút điều hướng mũi tên */
    .swiper-button-next, .swiper-button-prev {
      color: #ffffff !important;
      background: rgba(0, 0, 0, 0.3);
      width: 52px !important;
      height: 52px !important;
      border-radius: 50%;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    .swiper-button-next:hover, .swiper-button-prev:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.08);
    }
    .swiper-button-next::after, .swiper-button-prev::after {
      font-size: 20px !important;
      font-weight: bold;
    }

    /* Gợi ý điều hướng phía dưới */
    .footer-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      z-index: 100;
      letter-spacing: 0.5px;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 12px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
    }

    /* Thanh progress bar mỏng ở sát mép dưới cùng (Bottom Progress Bar) */
    .swiper-pagination-progressbar {
      position: fixed !important;
      bottom: 0 !important;
      top: auto !important;
      left: 0 !important;
      width: 100% !important;
      height: 4px !important; /* Độ dày thanh tiến trình */
      background: rgba(255, 255, 255, 0.2) !important;
      z-index: 1000 !important;
    }

    .swiper-pagination-progressbar .swiper-pagination-progressbar-fill {
      background: #ffffff !important; /* Màu của thanh tiến trình (trắng sáng) */
      transition-duration: 300ms !important;
    }
  </style>
</head>

  <!-- Swiper JS & Script -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const swiper = new Swiper('.swiper', {
      loop: false,
      speed: 400,
      keyboard: {
        enabled: true,
      },
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },
      pagination: {
        el: '.swiper-pagination',
        type: 'progressbar', // Hiển thị dạng thanh tiến trình (progress bar)
      },
      on: {
        init: function () {
          document.getElementById('total-slides').innerText = this.slides.length;
          document.getElementById('current-slide').innerText = this.activeIndex + 1;
        },
        slideChange: function () {
          document.getElementById('current-slide').innerText = this.activeIndex + 1;
        }
      }
    });
  </script>
